name: parental_care_app
description: "A Flutter app for remote caregiving - helping caregivers manage reminders and dependents receive assistance."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Routing
  go_router: ^15.1.2

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.6.2

  # Local Database
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.29
  path_provider: ^2.1.5
  path: ^1.9.1

  # Firebase & Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Local Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^5.0.1

  # Audio (Voice Notes)
  record: ^6.1.2
  audioplayers: ^6.4.0

  # Background Tasks
  workmanager: ^0.9.0+3

  # Permissions
  permission_handler: ^11.4.0

  # UUID Generation
  uuid: ^4.5.1

  # Cryptography (for password hashing)
  crypto: ^3.0.6

  # Shared Preferences (for simple settings)
  shared_preferences: ^2.5.3

  # Intl for date/time formatting
  intl: ^0.20.2

  # Share functionality
  share_plus: ^10.1.4

  # Remote API / Cloud Sync
  http: ^1.2.0
  signalr_netcore: ^1.3.7
  flutter_secure_storage: ^9.0.0

  # Animations & Effects
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  flutter_callkit_incoming: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.24.0
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
